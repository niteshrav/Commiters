server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Google Search Console must receive raw XML, never the SPA shell.
    location = /sitemap.xml {
        types { } 
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        types { } 
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
